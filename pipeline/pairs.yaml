# Bipartite calibration graph: every Earth site × every planetary site.
# `true` edges are the historically used (or chosen) analogs; every other edge is a
# wrong analog. A calibrated searcher should place true edges at lower distance.
# The 10 wrong edges are generated by pairs.py from the sites, so only true edges are listed.

true_edges:
  - { earth: sudbury,  target: apollo16,   basis: "Apollo 16 crew trained here; recognised Cayley breccia as impact breccia" }
  - { earth: atacama,  target: viking1,    basis: "Viking-style labelled-release experiments on Yungay soils (Navarro-González 2003)" }
  - { earth: atacama,  target: viking2,    basis: "Viking-style labelled-release experiments on Yungay soils (Navarro-González 2003)" }
  - { earth: haughton, target: shackleton, basis: "Chosen pairing: ~20 km polar impact crater vs ~21 km south-polar crater (HMP Moon analog)" }
  - { earth: haughton, target: phoenix,    basis: "Chosen pairing: polygonal ground and shallow ground ice (HMP Mars analog)" }
