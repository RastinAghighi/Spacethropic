[project]
name = "spacethropic-pipeline"
version = "0.1.0"
description = "Builds the Earth/Moon/Mars analog calibration dataset on an H3 grid."
requires-python = ">=3.12,<3.13"
dependencies = [
    "h3>=4.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.4",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
